server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_skill?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # === 核心修改：添加Jackson时间序列化配置 ===
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # === 核心修改：开启驼峰命名自动转换（确保create_time映射到createTime） ===
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:campusSkillPlatformSecretKey2024}
  expiration: 86400000 # 24小时

upload:
  path: D:/BiYeSheJi/campus-skill-platform/upload

cors:
  allowed-origins: http://localhost:5173,http://localhost:8080

order:
  default-demand-amount: 50.00

logging:
  level:
    com.example.campusskillplatform: debug

aliyun:
  sms:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:your-access-key-secret}
    sign-name: 速通互联验证码
    template-code: "100001"
